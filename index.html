<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>喜婚记 XiHunJi</title>
  <style>
    html,body{height:100%;margin:0;background:#f5f1ea}
    .xhj-load{height:100%;display:grid;place-items:center;font-family:system-ui;color:#786f69}
    .xhj-load b{display:block;text-align:center;font-family:serif;font-size:28px;color:#8f1e1e;margin-bottom:8px}
  </style>
</head>
<body>
  <div class="xhj-load"><div><b>囍 · 喜婚记</b>正在载入婚礼工作台…</div></div>
  <script>
  (async()=>{
    try{
      const version='20260908-auth-r2';
      const [appRes,cloudRes,publishFixRes,designCssRes,designJsRes,partyCssRes,partyJsRes,pairJsRes,authCssRes,authJsRes]=await Promise.all([
        fetch('./app.html?v='+version,{cache:'no-store'}),
        fetch('./xihunji-cloud.js?v='+version,{cache:'no-store'}),
        fetch('./xihunji-publish-fix.js?v='+version,{cache:'no-store'}),
        fetch('./xihunji-design-v2.css?v='+version,{cache:'no-store'}),
        fetch('./xihunji-design-v2.js?v='+version,{cache:'no-store'}),
        fetch('./xihunji-bridal-party.css?v='+version,{cache:'no-store'}),
        fetch('./xihunji-bridal-party.js?v='+version,{cache:'no-store'}),
        fetch('./xihunji-couple-pairing.js?v='+version,{cache:'no-store'}),
        fetch('./xihunji-auth-gate.css?v='+version,{cache:'no-store'}),
        fetch('./xihunji-auth-gate.js?v='+version,{cache:'no-store'})
      ]);
      if(!appRes.ok)throw Error('app.html '+appRes.status);
      if(!cloudRes.ok)throw Error('xihunji-cloud.js '+cloudRes.status);
      if(!publishFixRes.ok)throw Error('xihunji-publish-fix.js '+publishFixRes.status);
      if(!designCssRes.ok)throw Error('xihunji-design-v2.css '+designCssRes.status);
      if(!designJsRes.ok)throw Error('xihunji-design-v2.js '+designJsRes.status);
      if(!partyCssRes.ok)throw Error('xihunji-bridal-party.css '+partyCssRes.status);
      if(!partyJsRes.ok)throw Error('xihunji-bridal-party.js '+partyJsRes.status);
      if(!pairJsRes.ok)throw Error('xihunji-couple-pairing.js '+pairJsRes.status);
      if(!authCssRes.ok)throw Error('xihunji-auth-gate.css '+authCssRes.status);
      if(!authJsRes.ok)throw Error('xihunji-auth-gate.js '+authJsRes.status);

      let h=await appRes.text();
      const cloud=await cloudRes.text();
      const publishFix=await publishFixRes.text();
      const designCss=await designCssRes.text();
      const designJs=await designJsRes.text();
      const partyCss=await partyCssRes.text();
      const partyJs=await partyJsRes.text();
      const pairJs=await pairJsRes.text();
      const authCss=await authCssRes.text();
      const authJs=await authJsRes.text();

      h=h.replace('renderNav();\nbootInvitationRoute();','renderNav();');
      h=h.replace('renderNav();\r\nbootInvitationRoute();','renderNav();');

      const closeScript='</scr'+'ipt>';
      const supabaseTag='<scr'+'ipt src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">'+closeScript;
      const cloudTag='<scr'+'ipt>window.__XHJ_CLOUD_BUILD="'+version+'";'+cloud+closeScript;
      const publishTag='<scr'+'ipt>'+publishFix+closeScript;
      const designTag='<scr'+'ipt>'+designJs+closeScript;
      const partyTag='<scr'+'ipt>'+partyJs+closeScript;
      const pairTag='<scr'+'ipt>'+pairJs+closeScript;
      const authTag='<scr'+'ipt>'+authJs+closeScript;
      const styleTag='<style>'+designCss+'\n'+partyCss+'\n'+authCss+'\n.xhj-pair-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:34px;letter-spacing:.16em;margin:16px 0;color:var(--red)}.xhj-pair-join{display:grid;grid-template-columns:1fr auto;gap:8px}.xhj-pair-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.xhj-pair-head h3,.xhj-pair-card h3{margin-bottom:6px}@media(max-width:680px){.xhj-pair-join{grid-template-columns:1fr}.xhj-pair-code{font-size:28px}}'+'</style>';
      const bridge=styleTag+supabaseTag+cloudTag+publishTag+designTag+partyTag+pairTag+authTag;

      if(!h.includes('</body>'))throw Error('Invalid app shell');
      h=h.replace('</body>',bridge+'</body>');

      document.open();
      document.write(h);
      document.close();
    }catch(e){
      console.error('[XiHunJi boot]',e);
      document.body.innerHTML='<div class="xhj-load"><div><b>囍 · 喜婚记</b>载入失败，请刷新页面重试。<br><small style="display:block;margin-top:8px">'+String(e.message||e)+'</small></div></div>';
    }
  })();
  </script>
</body>
</html>
